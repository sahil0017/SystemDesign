[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systemdesign-agent"
version = "1.1.0"
description = "Automated agent that discovers trending system design problems, deduplicates against the repository and wiki ledger, and opens PRs with new problem sets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "sahil0017" }]
keywords = ["system-design", "automation", "github-actions", "scraping"]

dependencies = [
    "httpx>=0.27,<1.0",
    "scikit-learn>=1.4,<2.0",
    "numpy>=1.26,<3.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30,<2.0", "pandas>=2.0,<3.0"]
test = ["pytest>=7.0,<9.0", "pytest-asyncio>=0.21,<1.0"]

[project.urls]
Homepage = "https://github.com/sahil0017/SystemDesign"
Documentation = "https://github.com/sahil0017/SystemDesign/wiki"
Issues = "https://github.com/sahil0017/SystemDesign/issues"

[project.scripts]
systemdesign-agent = "agent.agent_main:main"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["agent/tests"]
