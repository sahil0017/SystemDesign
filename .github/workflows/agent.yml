name: SystemDesign Agent

on:
  schedule:
    # Run every 12 hours (midnight and noon UTC)
    - cron: "0 0,12 * * *"
  workflow_dispatch:
    # Allow manual triggers for testing

permissions:
  contents: write
  pull-requests: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: Install GitHub CLI
        run: |
          type gh >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y gh
          }

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Authenticate GitHub CLI
        run: gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: Run agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_PATH: ${{ github.workspace }}
          RUN_HISTORY_FILE: ${{ runner.temp }}/run_history.json
          CACHE_DIR: ${{ runner.temp }}/agent-cache
          LOG_LEVEL: INFO
        run: |
          cd agent
          python agent_main.py

      - name: Download previous run history
        if: always()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: run-history
          path: ${{ runner.temp }}/

      - name: Upload run history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-history
          path: ${{ runner.temp }}/run_history.json
          retention-days: 30
