name: SystemDesign Agent

on:
  schedule:
    # Off-hour cron to avoid GitHub's hourly contention window
    - cron: "7 4,16 * * *"
  workflow_dispatch:
    inputs:
      force_run:
        description: "Force agent run even if an open agent PR exists"
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "agent/**"
  pull_request:
    branches: [main]
    paths:
      - "agent/**"

permissions:
  contents: write
  pull-requests: write

# Never run two agent pipelines concurrently
concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ #
  #  Stage 1 — Validate: lint + unit tests
  # ------------------------------------------------------------------ #
  validate:
    name: "1 · Validate (lint + tests)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r agent/requirements.txt ruff

      - name: Lint
        run: |
          echo "### Lint (ruff)" >> "$GITHUB_STEP_SUMMARY"
          ruff check agent/ --select E,F,W --ignore E501,E402 \
            | tee >(tail -n +1 >> "$GITHUB_STEP_SUMMARY") || true

      - name: Unit tests
        env:
          REPO_PATH: ${{ github.workspace }}
          DRY_RUN: "true"
        run: |
          cd agent
          python -m pytest tests/ -q --tb=short 2>&1 | tee ../pytest.log
          echo "### Unit tests" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -5 ../pytest.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: ML classifier smoke test
        run: |
          cd ..
          python3 - <<'EOF' | tee ml-smoke.log
          import sys; sys.path.insert(0, '.')
          from agent.ml_classifier import ProblemClassifier
          from agent.scraper.sources import PROBLEM_KEYWORDS
          c = ProblemClassifier(keyword_db=PROBLEM_KEYWORDS)
          trained = c.fit()
          assert trained, "classifier failed to train"
          for name in ["E-Mail Service", "Printer Spooler", "Circuit Breaker Utils"]:
              cat, conf = c.predict_with_confidence(name)
              print(f"  {name!r:28s} -> {cat.value if cat else None} ({conf:.2f})")
          print("ML smoke test OK")
          EOF
          echo "### ML classifier smoke test" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat ml-smoke.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------ #
  #  Stage 2 — Discover: scrape + dedup (pipeline visible in summary)
  # ------------------------------------------------------------------ #
  discover:
    name: "2 · Discover (scrape + dedup vs wiki)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: validate
    if: >
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push'
    outputs:
      has_work: ${{ steps.discover.outputs.has_work }}
      pr_url: ${{ steps.discover.outputs.pr_url }}
      discovered: ${{ steps.discover.outputs.discovered }}
      duplicates: ${{ steps.discover.outputs.duplicates }}
      selected: ${{ steps.discover.outputs.selected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies + gh
        run: |
          pip install -r agent/requirements.txt
          type gh >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y gh; }

      - name: Configure Git + GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # GH_TOKEN env var authenticates gh automatically; no login needed
          gh label create automated --repo "$GITHUB_REPOSITORY" \
            --description "Auto-generated by agent" --color 5319E7 2>/dev/null || true

      - name: Guard — skip if agent PR awaiting review
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title auto-generated" --json number --jq 'length' 2>/dev/null || echo 0)
          STALE=$(gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
            --jq '[.[] | select(.name | startswith("agent/add-problems")) | .name]' 2>/dev/null || echo '')
          if [ "$COUNT" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            for b in $STALE; do
              [ -n "$b" ] || continue
              echo "Deleting stale branch: $b"
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$b" 2>/dev/null || true
            done
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
          FORCE="${{ github.event.inputs.force_run || 'false' }}"
          if [ "$FORCE" = "true" ]; then echo "skip=false" >> "$GITHUB_OUTPUT"; fi

      - name: Restore scraped-data cache (shared with publish stage)
        uses: actions/cache@v4
        with:
          path: scraped-state
          key: scraped-${{ github.run_id }}

      - name: Discover problems (scrape → dedup → classify)
        id: discover
        if: steps.guard.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_PATH: ${{ github.workspace }}
          LOG_LEVEL: INFO
          SCRAPED_STATE_DIR: ${{ github.workspace }}/scraped-state
        run: |
          python -m agent.agent_main --stage discover 2>&1 | tee discover.log
          HAS_WORK=$(grep -c "DISCOVER_RESULT" discover.log || true)
          {
            echo "### 🔍 Discovery stage"
            echo '```'
            grep -E "\[(INFO|WARNING|ERROR)\]" discover.log | sed 's/^[^ ]* //' || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Emit outputs parsed from a machine-readable line
          LINE=$(grep "DISCOVER_RESULT" discover.log | tail -1 || true)
          if [ -n "$LINE" ]; then
            DISCOVERED=$(echo "$LINE" | sed -E 's/.*discovered=([0-9]+).*/\1/')
            DUPLICATES=$(echo "$LINE" | sed -E 's/.*duplicates=([0-9]+).*/\1/')
            SELECTED=$(echo "$LINE" | sed -E 's/.*selected=([0-9]+).*/\1/')
            echo "discovered=$DISCOVERED"   >> "$GITHUB_OUTPUT"
            echo "duplicates=$DUPLICATES"   >> "$GITHUB_OUTPUT"
            echo "selected=$SELECTED"       >> "$GITHUB_OUTPUT"
            echo "has_work=true"            >> "$GITHUB_OUTPUT"
          else
            echo "has_work=false" >> "$GITHUB_OUTPUT"
            echo "### ℹ️ Nothing new to add (all duplicates or already in PR)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # ------------------------------------------------------------------ #
  #  Stage 3 — Publish: generate files, open PR, update wiki ledger
  # ------------------------------------------------------------------ #
  publish:
    name: "3 · Publish (generate → PR → wiki ledger)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: discover
    if: needs.discover.outputs.has_work == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore scraped-data cache (saved by discover stage)
        uses: actions/cache@v4
        with:
          path: scraped-state
          key: scraped-${{ github.run_id }}

      - name: Install dependencies + gh
        run: |
          pip install -r agent/requirements.txt
          type gh >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y gh; }

      - name: Configure Git + GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Generate problems, open PR, update wiki
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_PATH: ${{ github.workspace }}
          LOG_LEVEL: INFO
          SCRAPED_STATE_DIR: ${{ github.workspace }}/scraped-state
        run: |
          python -m agent.agent_main --stage publish 2>&1 | tee publish.log
          LINE=$(grep "PUBLISH_RESULT" publish.log | tail -1 || true)
          if [ -n "$LINE" ]; then
            PR_URL=$(echo "$LINE" | sed -E 's/.*pr_url=([^ ]*).*/\1/')
            GENERATED=$(echo "$LINE" | sed -E 's/.*generated=([0-9]+).*/\1/')
            echo "pr_url=$PR_URL"       >> "$GITHUB_OUTPUT"
            echo "generated=$GENERATED" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### 📦 Publish stage"
            echo '```'
            grep -E "\[(INFO|WARNING|ERROR)\]" publish.log | sed 's/^[^ ]* //' || true
            echo '```'
            if [ -n "$PR_URL" ] && [ "$PR_URL" != "none" ]; then
              echo "**✅ PR created: $PR_URL**"
            else
              echo "⚠️ No PR created"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Job summary
        if: always()
        run: |
          {
            echo "### 📊 Pipeline summary"
            echo "| Stage | Result |"
            echo "|-------|--------|"
            echo "| Validated | ✅ |"
            echo "| Discovered | ${{ needs.discover.outputs.discovered || 0 }} trending (${{
              needs.discover.outputs.duplicates || 0 }} duplicates skipped) |"
            echo "| Selected | ${{ needs.discover.outputs.selected || 0 }} new problems |"
            echo "| Published | ${{ steps.publish.outputs.generated || 0 }} files → ${{ steps.publish.outputs.pr_url || 'no PR' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
