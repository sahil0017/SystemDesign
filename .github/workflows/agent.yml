name: SystemDesign Agent

on:
  schedule:
    # Run every 12 hours (midnight and noon UTC)
    - cron: "0 0,12 * * *"
  workflow_dispatch:
    # Allow manual triggers for testing
  push:
    branches: [main]
    paths:
      - "agent/**"
  pull_request:
    branches: [main]
    paths:
      - "agent/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  # ------------------------------------------------------------------ #
  #  CI: Lint and test the agent package
  # ------------------------------------------------------------------ #
  test-agent:
    name: Test Agent (v1.0.0)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check agent/ --select E,F,W --ignore E501,E402 || true

      - name: Run tests
        env:
          REPO_PATH: ${{ github.workspace }}
          DRY_RUN: "true"
        run: |
          cd agent
          python -m pytest tests/ -v --tb=short

  # ------------------------------------------------------------------ #
  #  Run the agent (scheduled or manual)
  # ------------------------------------------------------------------ #
  run-agent:
    name: Run Agent (v1.0.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test-agent
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.test-agent.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: Install GitHub CLI
        run: |
          type gh >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y gh
          }

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Authenticate GitHub CLI
        run: gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: Run agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_PATH: ${{ github.workspace }}
          RUN_HISTORY_FILE: ${{ runner.temp }}/run_history.json
          CACHE_DIR: ${{ runner.temp }}/agent-cache
          LOG_LEVEL: INFO
        run: |
          cd agent
          python -m agent.agent_main

      - name: Download previous run history
        if: always()
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: run-history
          path: ${{ runner.temp }}/

      - name: Upload run history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-history
          path: ${{ runner.temp }}/run_history.json
          retention-days: 30
