name: SystemDesign Agent

on:
  schedule:
    # Run at 04:07 and 16:07 UTC (offset from the hour — GitHub crons on the
    # hour face heavy contention and are often delayed 15-30+ min)
    - cron: "7 4,16 * * *"
  workflow_dispatch:
    # Allow manual triggers for testing
  push:
    branches: [main]
    paths:
      - "agent/**"
  pull_request:
    branches: [main]
    paths:
      - "agent/**"

permissions:
  contents: write
  pull-requests: write

# Concurrency guard: a scheduled run is skipped (superseded) if a newer run
# starts, preventing overlapping agent executions and PR stampedes.
concurrency:
  group: agent-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------ #
  #  CI: Lint and test the agent package
  # ------------------------------------------------------------------ #
  test-agent:
    name: Test Agent (v1.0.0)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check agent/ --select E,F,W --ignore E501,E402 || true

      - name: Run tests
        env:
          REPO_PATH: ${{ github.workspace }}
          DRY_RUN: "true"
        run: |
          cd agent
          python -m pytest tests/ -v --tb=short

  # ------------------------------------------------------------------ #
  #  Run the agent (scheduled or manual)
  # ------------------------------------------------------------------ #
  run-agent:
    name: Run Agent (v1.0.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test-agent
    if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && needs.test-agent.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements.txt

      - name: Install GitHub CLI
        run: |
          type gh >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y gh
          }

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Authenticate GitHub CLI
        run: gh auth login --with-token <<< "${{ secrets.GITHUB_TOKEN }}"

      - name: Download previous run history
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: run-history
          path: ${{ runner.temp }}/

      - name: Make git operations non-destructive
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Guard - skip if an agent PR is already open
        id: guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh pr list --repo ${GITHUB_REPOSITORY} --state open \
            --search "in:title auto-generated" \
            --json number --jq 'length' 2>/dev/null || echo 0)
          BRANCHED=$(gh api "repos/${GITHUB_REPOSITORY}/branches?per_page=100" \
            --jq '[.[] | select(.name | startswith("agent/add-problems"))] | length' 2>/dev/null || echo 0)
          echo "open-agent-prs=$COUNT agent-branches=$BRANCHED"
          if [ "$COUNT" != "0" ] || [ "${BRANCHED:-0}" != "0" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run agent
        if: steps.guard.outputs.skip != 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_PATH: ${{ github.workspace }}
          RUN_HISTORY_FILE: ${{ runner.temp }}/run_history.json
          CACHE_DIR: ${{ runner.temp }}/agent-cache
          LOG_LEVEL: INFO
        run: |
          python -m agent.agent_main

      - name: Deploy Streamlit dashboard to GitHub Pages host
        # Streamlit can't run on static GitHub Pages; this writes a deploy
        # marker consumed by the separate dashboard workflow (Streamlit Cloud
        # auto-syncs the repo, so a push is the deployment trigger).
        if: steps.guard.outputs.skip == 'true'
        run: echo "Agent run skipped (open PR already exists). Dashboard syncs via Streamlit Community Cloud on next merge to main."

      - name: Upload run history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-history
          path: ${{ runner.temp }}/run_history.json
          retention-days: 30
